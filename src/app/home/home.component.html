<div class="page">

  <!-- Hero -->
  <section class="hero">
    <div class="badge">Hausverwaltung App</div>
    <h1>Verwalte deine Immobilien<br><span class="accent">einfach &amp; smart</span></h1>
    <p>
      Alles an einem Ort – Kunden, Ablesungen, Import &amp; Export und
      grafische Auswertungen für deine Liegenschaftsverwaltung.
    </p>
    <div class="cta-row">
      <button class="btn-primary" (click)="goToCustomers()">
        <i class="ti ti-arrow-right"></i> Jetzt starten
      </button>
      <button class="btn-outline" (click)="goToReadings()">
        Ablesungen ansehen ↗
      </button>
    </div>
  </section>

  <hr class="divider">

  <!-- Feature Cards -->
  <section class="features">
    <div class="feature-card" *ngFor="let f of features">
      <div class="feature-icon" [style.background]="f.bgColor">
        <i [class]="f.icon" [style.color]="f.iconColor"></i>
      </div>
      <h3>{{ f.title }}</h3>
      <p>{{ f.description }}</p>
    </div>
  </section>

  <!-- Stats -->
  <section class="stats">
    <div class="stat" *ngFor="let s of stats">
      <div class="stat-num">{{ s.value }}</div>
      <div class="stat-label">{{ s.label }}</div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>Hausverwaltung · Gebaut mit Angular &amp; Java · 2026</p>
  </footer>

</div>
