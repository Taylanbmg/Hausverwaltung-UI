<div class="content">
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-design">

  <mat-form-field class="form-field">
    <input matInput placeholder="Vorname" formControlName="firstName">
  </mat-form-field>

  <mat-form-field class="form-field">
    <input matInput placeholder="Nachname" formControlName="lastName">
  </mat-form-field>

  <mat-form-field class="form-field">
    <mat-label>Geschlecht</mat-label>
    <mat-select formControlName="gender">
      <mat-option *ngFor="let g of geschlechterList" [value]="g.value">
        {{ g.label }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field class="form-field">
    <mat-label>Geburtsdatum</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="birthDate">
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">
    Speichern
  </button>

</form>
</div>
