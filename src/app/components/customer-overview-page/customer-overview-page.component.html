<div class="button-container">
  <button class="button-66" mat-fab extended color="primary" (click)="goToSuche()">
    <mat-icon> search </mat-icon>
    Kunden suche
  </button>
  <button class="button-66" mat-fab extended color="primary" (click)="goToCustomerErstellen()">
    <mat-icon> add </mat-icon>
    Kunde erstellen
  </button>
  <button class="button-66" mat-fab extended color="primary" (click)="goToCustomerUpdate()">
    <mat-icon> update </mat-icon>
    Kunde updaten
  </button>
  <button class="button-66" mat-fab extended color="primary" (click)="goToCustomerDelete()">
    <mat-icon> delete </mat-icon>
    Kunde löschen
  </button>
</div>
